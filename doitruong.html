<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Điểm danh · Nghĩa 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap" style="max-width:640px">
  <header class="mast">
    <div class="brand"><img class="logo" src="logo.png" alt="Huy hiệu lớp Nghĩa Sĩ 3" width="76" height="76"><div>
      <p class="org">Lớp Nghĩa 3</p>
      <h1 id="title">Điểm danh</h1>
      <p class="theme" id="theme">Môn đệ nhỏ loan Tin Mừng</p>
    </div></div>
  </header>

  <div id="login" class="login" hidden>
    <h2>Nhập PIN của đội</h2>
    <p class="note">Mỗi Đội trưởng có một PIN riêng do Huynh Trưởng cấp.</p>
    <div class="field"><label for="pin">PIN</label><input type="password" id="pin" inputmode="numeric" autocomplete="off"></div>
    <button class="btn gold block" id="btnLogin">Vào điểm danh</button>
    <p class="error" id="loginErr" hidden></p>
    <p class="note" style="text-align:center"><a href="index.html">Xem bảng thi đua</a></p>
  </div>

  <div id="app" hidden>
    <div class="field" id="teamField" hidden>
      <label for="team">Đội</label>
      <select id="team"></select>
    </div>

    <div class="weekbar">
      <button class="step" type="button" id="wkPrev" aria-label="Chúa Nhật trước">‹</button>
      <select id="week" aria-label="Chọn Chúa Nhật"></select>
      <button class="step" type="button" id="wkNext" aria-label="Chúa Nhật sau">›</button>
    </div>
    <p class="wknote" id="wkNote"></p>

    <div class="hint" id="hint">
      <span>Chạm vào tên em <b>vắng</b>. Em nào không chạm là có mặt.</span>
      <button class="link" type="button" id="btnReset">Đặt lại</button>
    </div>

    <div class="att-list" id="list"></div>

    <div class="sticky-bar solid">
      <div class="bar-row">
        <span class="summary-pill" id="summary">0 có mặt</span>
        <span id="barRight" style="display:flex"></span>
      </div>
      <button class="btn gold block" id="btnSave">Lưu điểm danh</button>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var h = N3.h;
  var raw = null, model = null, role = null, state = {}, menu = null, syncStepper = null;

  function showLogin(msg) {
    document.getElementById('app').hidden = true;
    document.getElementById('login').hidden = false;
    var e = document.getElementById('loginErr'); e.hidden = !msg; e.textContent = msg || '';
    if (menu) menu.setRole(null);
  }
  function tryLogin(pin) {
    N3.setBusy(true);
    return N3.apiPost({ action: 'verify', pin: pin }).then(function (res) {
      role = res.role; N3.savePin(pin);
      if (menu) menu.setRole(role);
      document.getElementById('login').hidden = true;
      document.getElementById('app').hidden = false;
      return load();
    }).catch(function (err) { showLogin(err.message); }).finally(function () { N3.setBusy(false); });
  }
  document.getElementById('btnLogin').onclick = function () { tryLogin(document.getElementById('pin').value.trim()); };
  document.getElementById('pin').addEventListener('keydown', function (e) { if (e.key === 'Enter') document.getElementById('btnLogin').click(); });

  menu = N3.mountRoleMenu({ page: 'doitruong', role: null, anchor: '#barRight', onReload: function () { load(); } });

  function load() {
    N3.setBusy(true);
    return N3.apiGet('data').then(function (res) {
      raw = res.data; model = N3.compute(raw);
      document.getElementById('theme').textContent = raw.settings.chuDe || '';
      // HT được chọn đội; Đội trưởng khoá đúng đội mình
      var tf = document.getElementById('teamField'), ts = document.getElementById('team');
      ts.innerHTML = '';
      Object.keys(model.teams).map(Number).sort().forEach(function (d) { ts.appendChild(h('option', { value: d, text: model.teams[d].name })); });
      if (role.role === 'ht') { tf.hidden = false; } else { tf.hidden = true; ts.value = role.doi; }
      fillWeeks(); renderList();
    }).catch(function (err) { N3.toast('Không tải được dữ liệu: ' + err.message, 'err'); })
      .finally(function () { N3.setBusy(false); });
  }

  function currentTeam() { return Number(document.getElementById('team').value); }

  function fillWeeks() {
    var sel = document.getElementById('week'); var cur = sel.value;
    sel.innerHTML = '';
    var list = N3.sundays(raw.settings.ngayBatDau);
    model.dates.forEach(function (d) { if (list.indexOf(d) === -1) list.push(d); });
    var today = N3.latestSunday();
    list.sort().reverse().forEach(function (iso) {
      sel.appendChild(h('option', { value: iso, text: 'CN ' + N3.fmtVN(iso) }));
    });
    sel.value = cur && list.indexOf(cur) > -1 ? cur : today;
    if (!sel.value) sel.selectedIndex = 0;
    if (!syncStepper) {
      syncStepper = N3.wireWeekStepper(sel, document.getElementById('wkPrev'), document.getElementById('wkNext'), renderList);
    }
    syncStepper();
  }
  document.getElementById('team').onchange = renderList;


  /** Dòng chú thích dưới thanh chọn tuần: tuần nào + đã lưu hay chưa */
  function updateWeekNote() {
    var el = document.getElementById('wkNote');
    var iso = document.getElementById('week').value;
    if (!el || !iso) { if (el) el.textContent = ''; return; }
    var today = N3.latestSunday();
    var when = iso === today ? 'Chúa Nhật tuần này' : (iso > today ? 'Chúa Nhật sắp tới' : 'Chúa Nhật đã qua');
    var wk = model.teams[currentTeam()].weekly[iso];
    el.textContent = when + (wk && wk.recorded ? ' · đã lưu ' + wk.present + '/' + wk.recorded + ' có mặt' : ' · chưa lưu');
  }

  function renderList() {
    updateWeekNote();
    var d = currentTeam(), iso = document.getElementById('week').value;
    var t = model.teams[d]; var wk = t.weekly[iso];
    document.getElementById('title').textContent = 'Điểm danh ' + t.name;
    state = {};
    var existing = {};
    if (wk) wk.attendance.forEach(function (a) { existing[a.id] = a; });
    var daLuu = wk && wk.recorded > 0;

    var list = document.getElementById('list'); list.innerHTML = '';
    t.active.forEach(function (m) {
      var ex = existing[m.id];
      // Buổi chưa lưu: mặc định có mặt. Buổi đã lưu: hiện đúng như đã lưu.
      // Em mới vào sau buổi đó thì không có bản ghi -> cũng mặc định có mặt.
      state[m.id] = {
        hoTen: m.tenThanh + ' ' + m.hoTen,
        coMat: ex ? ex.coMat : true,
        ghiChu: ex ? ex.ghiChu : ''
      };
      var note = h('input', { type: 'text', class: 'att-note', placeholder: 'Lý do vắng (vd: có phép)', value: state[m.id].ghiChu });
      note.oninput = function () { state[m.id].ghiChu = note.value; };

      // Dòng trên (tên + nhãn) là vùng chạm; ô lý do nằm riêng một dòng bên dưới
      // để chạm lại sửa nhầm không bao giờ rơi trúng ô nhập liệu.
      var top = h('div', {
        class: 'att-top', role: 'button', tabindex: '0',
        onclick: function () { toggle(m.id); },
        onkeydown: function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(m.id); } }
      }, [
        h('div', { class: 'name' }, [m.tenThanh + ' ' + m.hoTen, m.role ? h('small', { text: m.role }) : null]),
        h('span', { class: 'mark' })
      ]);
      var row = h('div', { class: 'att-row', 'data-id': m.id }, [top, note]);
      row._top = top;
      row._note = note;
      list.appendChild(row);
      paint(m.id);
    });

    document.getElementById('btnSave').dataset.mode = daLuu ? 'update' : 'new';
    updateSummary();
  }

  function toggle(id) {
    state[id].coMat = !state[id].coMat;
    if (navigator.vibrate) navigator.vibrate(10);
    paint(id); updateSummary();
    // Không tự bật con trỏ vào ô lý do: trên điện thoại bàn phím sẽ bật lên
    // che danh sách mỗi lần đánh vắng, trong khi lý do không bắt buộc.
  }

  function paint(id) {
    var row = document.querySelector('.att-row[data-id="' + id + '"]');
    var co = state[id].coMat;
    row.classList.toggle('absent', !co);
    row._top.setAttribute('aria-pressed', co ? 'false' : 'true');
    row._top.setAttribute('aria-label', state[id].hoTen + (co ? ', có mặt. Chạm để đánh vắng' : ', vắng. Chạm để đánh có mặt'));
    row.querySelector('.mark').textContent = co ? 'Có mặt' : 'Vắng';
    row._note.hidden = co;
  }

  /** Nút Lưu tự ghi rõ sắp lưu gì, để không lưu nhầm mà không hay */
  function updateSummary() {
    var ids = Object.keys(state);
    var vang = ids.filter(function (i) { return !state[i].coMat; });
    var co = ids.length - vang.length;
    document.getElementById('summary').textContent =
      co + ' có mặt · ' + vang.length + ' vắng';
    var btn = document.getElementById('btnSave');
    if (btn.dataset.saving === '1') return;
    var verb = btn.dataset.mode === 'update' ? 'Cập nhật' : 'Lưu';
    btn.textContent = verb + ' · ' + co + ' có mặt, ' + vang.length + ' vắng';
  }

  document.getElementById('btnReset').onclick = function () {
    Object.keys(state).forEach(function (i) { state[i].coMat = true; state[i].ghiChu = ''; paint(i); });
    document.querySelectorAll('.att-note').forEach(function (n) { n.value = ''; });
    updateSummary();
    N3.toast('Đã đặt lại: cả đội có mặt');
  };

  document.getElementById('btnSave').onclick = function () {
    var btn = this;
    if (btn.dataset.saving === '1') return;   // chặn bấm liên tiếp
    var ids = Object.keys(state);
    var iso = document.getElementById('week').value, d = currentTeam();
    var records = ids.map(function (i) {
      return { id: i, hoTen: state[i].hoTen, coMat: state[i].coMat === true, ghiChu: state[i].coMat ? '' : (state[i].ghiChu || '') };
    });
    btn.dataset.saving = '1'; btn.textContent = 'Đang lưu…';
    N3.setBusy(true);
    N3.apiPost({ action: 'saveAttendance', pin: N3.savedPin(), doi: d, ngay: iso, records: records }).then(function (res) {
      raw = res.data; model = N3.compute(raw);
      btn.dataset.saving = '0';
      renderList();
      N3.toast('Đã lưu điểm danh ' + N3.fmtVN(iso), 'ok');
    }).catch(function (err) {
      btn.dataset.saving = '0'; updateSummary();
      N3.toast(err.message, 'err'); if (/PIN/.test(err.message)) showLogin(err.message);
    }).finally(function () { N3.setBusy(false); });
  };

  var pin = N3.savedPin();
  if (pin) tryLogin(pin); else showLogin();
})();
</script>
</body>
</html>
