<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bảng thi đua Nghĩa 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="preload" as="image" href="assets/laurel.webp">
<link rel="preload" as="image" href="assets/trophy.webp">
<link rel="stylesheet" href="style.css">
</head>
<body class="dash">
<div class="wrap">
  <header class="mast compact">
    <div class="brand">
      <img class="logo" src="logo.png" alt="Huy hiệu lớp Nghĩa Sĩ 3" width="56" height="56">
      <div class="brand-text">
        <p class="org" id="org">Đoàn Thiếu Nhi Thánh Tâm – Giáo xứ Gia Định</p>
        <h1 id="title">Bảng thi đua Nghĩa 3</h1>
        <p class="theme" id="theme">MÔN ĐỆ NHỎ LOAN TIN MỪNG</p>
      </div>
    </div>
  </header>

  <nav class="tabs icon-tabs" role="tablist" id="tabs" aria-label="Các mục của bảng thi đua">
    <button role="tab" aria-selected="true" data-tab="tong"><span>Tổng hợp</span></button>
    <button role="tab" aria-selected="false" data-tab="cc"><span>Chuyên cần</span></button>
    <button role="tab" aria-selected="false" data-tab="ht"><span>Học tập</span></button>
    <button role="tab" aria-selected="false" data-tab="kl"><span>Kỷ luật</span></button>
    <button role="tab" aria-selected="false" data-tab="bai"><span>Bài học</span></button>
  </nav>

  <section class="panel" id="panel-tong"></section>
  <section class="panel" id="panel-cc" hidden></section>
  <section class="panel" id="panel-ht" hidden></section>
  <section class="panel" id="panel-kl" hidden></section>
  <section class="panel" id="panel-bai" hidden></section>

  <p class="note rule" id="rule"></p>
  <p class="updated" id="updated"></p>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var h = N3.h, fmt = N3.fmt, pts = N3.pts;
  var model = null, raw = null, loadedOnce = false;
  var CRIT = { cc: 'Chuyên cần', ht: 'Học tập', kl: 'Kỷ luật' };

  /* ---------- Tab: biểu tượng + chữ, 5 tab vừa một màn hình ---------- */
  var tabs = document.getElementById('tabs');
  tabs.querySelectorAll('button[data-tab]').forEach(function (b) {
    b.insertAdjacentHTML('afterbegin', N3.glyph(b.dataset.tab));
  });
  tabs.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    tabs.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-selected', x === b ? 'true' : 'false'); });
    document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== 'panel-' + b.dataset.tab; });
    document.getElementById('rule').hidden = b.dataset.tab === 'bai';
  });

  /* ---------- Tải dữ liệu ---------- */
  function load() {
    var p = document.getElementById('panel-tong');
    if (!loadedOnce) { p.innerHTML = ''; p.appendChild(N3.skeleton()); }
    N3.apiGet('data').then(function (res) {
      raw = res.data; model = N3.compute(raw); loadedOnce = true;
      render();
    }).catch(function (err) {
      if (loadedOnce) { N3.toast('Chưa cập nhật được: ' + err.message, 'err'); return; }
      p.innerHTML = '';
      var v = N3.stateView({
        img: 'offline', kind: 'err',
        title: 'Chưa tải được bảng thi đua',
        text: 'Kiểm tra kết nối mạng rồi thử lại.',
        action: { label: 'Thử lại', run: load },
        secondary: { label: 'Nhập lại địa chỉ máy chủ', run: function () { N3.resetApi(); location.reload(); } }
      });
      v.appendChild(h('p', { class: 'tech', text: err.message }));
      p.appendChild(v);
    });
  }

  function render() {
    var s = raw.settings;
    document.getElementById('org').textContent = (s.xuDoan || '') + (s.namHoc ? ' · năm học ' + s.namHoc : '');
    document.getElementById('title').textContent = 'Bảng thi đua ' + (s.lop || 'Nghĩa 3');
    document.getElementById('theme').textContent = s.chuDe || '';
    document.getElementById('rule').textContent =
      'Điểm thi đua = điểm tuần × 10, cộng dồn cả năm. Điểm tuần = ' + s.weights.cc + '% chuyên cần + ' +
      s.weights.ht + '% học tập + ' + s.weights.kl + '% kỷ luật. Số nhỏ cạnh biểu tượng lửa, sách, khiên là điểm trung bình từng tiêu chí, thang 10.';
    document.getElementById('updated').textContent = 'Cập nhật ' + new Date(raw.generatedAt).toLocaleString('vi-VN');

    renderTong();
    renderCriterion('cc', function (wk) { return wk.recorded ? wk.present + '/' + wk.recorded : '–'; });
    renderCriterion('ht', function (wk) { return fmt(wk.ht); });
    renderCriterion('kl', function (wk) { return fmt(wk.kl); });
    renderLessons();
  }

  /* ---------- Số liệu phụ ---------- */
  /** Xếp hạng lũy kế tính đến trước tuần mới nhất, để biết đội lên/xuống mấy bậc */
  function previousRanking() {
    if (model.dates.length < 2) return null;
    var upto = model.dates.slice(0, -1);
    var totals = Object.keys(model.teams).map(Number).map(function (doi) {
      var t = model.teams[doi], sum = 0;
      upto.forEach(function (iso) { if (t.weekly[iso] && t.weekly[iso].hasData) sum += t.weekly[iso].total; });
      return { doi: doi, sum: sum };
    });
    totals.sort(function (a, b) { return (b.sum - a.sum) || (a.doi - b.doi); });
    var map = {};
    totals.forEach(function (x, i) { map[x.doi] = i + 1; });
    return map;
  }

  /** Số Chúa Nhật liên tiếp gần nhất đội đi đủ */
  function streak(t) {
    var n = 0;
    for (var i = model.dates.length - 1; i >= 0; i--) {
      var wk = t.weekly[model.dates[i]];
      if (wk && wk.recorded && wk.cc === 10) n++; else break;
    }
    return n;
  }

  function moveTag(doi, prev) {
    if (!prev || !prev[doi]) return null;
    var d = prev[doi] - model.teams[doi].rank;
    if (!d) return null;
    return h('span', { class: 'move ' + (d > 0 ? 'up' : 'down'),
      'aria-label': d > 0 ? 'Lên ' + d + ' hạng so với tuần trước' : 'Xuống ' + (-d) + ' hạng so với tuần trước',
      text: (d > 0 ? '▲ ' : '▼ ') + Math.abs(d) });
  }

  function streakTag(t) {
    var st = streak(t);
    if (st < 2) return null;
    return h('span', { class: 'streak', title: st + ' tuần liên tiếp đi đủ' },
      [N3.asset('icon-streak', 16), st + ' tuần đi đủ']);
  }

  /* ---------- Đội của em ---------- */
  function teamPicker(mine) {
    var wrap = h('div', { class: 'picker2', role: 'group', 'aria-label': 'Chọn đội của em' }, [
      h('p', { class: 'lab', text: mine ? 'Đội của em' : 'Chạm vào đội của em' })
    ]);
    var row = h('div', { class: 'picks' });
    Object.keys(model.teams).map(Number).sort().forEach(function (d) {
      var t = model.teams[d];
      row.appendChild(h('button', {
        type: 'button', class: 'pk' + (d === mine ? ' on' : ''), style: { '--team': t.color },
        'aria-pressed': d === mine ? 'true' : 'false',
        onclick: function () { N3.setMyTeam(d === mine ? null : d); render(); }
      }, [N3.mascot(d, 58), h('span', { text: t.name })]));
    });
    wrap.appendChild(row);
    return wrap;
  }

  /** Một câu trả lời thẳng: đội em hạng mấy, cách đội đứng trên bao nhiêu điểm */
  function myTeamSummary(doi) {
    var t = model.teams[doi], rank = t.rank, msg;
    if (rank === 1) {
      var second = model.teams[model.ranking[1]];
      var lead = second ? N3.ptsNum(t.season.total) - N3.ptsNum(second.season.total) : 0;
      msg = [h('b', { text: t.name + ' đang dẫn đầu' }),
             second ? ', hơn ' + second.name + ' ' + lead + ' điểm. Giữ vững nhé!' : '.'];
    } else {
      var above = model.teams[model.ranking[rank - 2]];
      var gap = N3.ptsNum(above.season.total) - N3.ptsNum(t.season.total);
      msg = [h('b', { text: t.name + ' đang hạng ' + rank }),
             ', cách ' + above.name + ' ' + gap + ' điểm.'];
      var hint = weakest(t);
      if (hint) msg.push(' Nâng ' + hint + ' là cách nhanh nhất để vượt lên.');
    }
    return h('div', { class: 'mysum', style: { '--team': t.color } }, [N3.mascot(doi, 34), h('p', null, msg)]);
  }

  /** Tiêu chí đội đang kém đội dẫn đầu tiêu chí đó nhiều nhất, có tính trọng số */
  function weakest(t) {
    var w = model.weights, keys = [['cc', 'chuyên cần'], ['ht', 'học tập'], ['kl', 'kỷ luật']];
    var best = null, bestGain = 0;
    keys.forEach(function (k) {
      var top = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season[k[0]] || 0; }));
      var gain = (top - (t.season[k[0]] || 0)) * w[k[0]];
      if (gain > bestGain) { bestGain = gain; best = k[1]; }
    });
    return best;
  }

  /* ---------- Tab Tổng hợp ---------- */
  function renderTong() {
    var p = document.getElementById('panel-tong'); p.innerHTML = '';
    if (!model.dates.length) {
      p.appendChild(N3.stateView({ img: 'empty-start', title: 'Mùa thi đua sắp bắt đầu',
        text: 'Bảng xếp hạng sẽ hiện ra sau buổi điểm danh đầu tiên.' }));
      return;
    }

    // Quán quân tuần gần nhất
    var lastISO = model.dates[model.dates.length - 1];
    var weekOrder = model.ranking.slice().sort(function (a, b) {
      return (model.teams[b].weekly[lastISO].total - model.teams[a].weekly[lastISO].total) || (a - b);
    });
    var champ = model.teams[weekOrder[0]];
    if (champ.weekly[lastISO].hasData) {
      p.appendChild(h('div', { class: 'champ2' }, [
        h('span', { class: 'sparkles', 'aria-hidden': 'true' }, [h('i'), h('i'), h('i')]),
        N3.asset('trophy', 96, 'trophy'),
        h('div', { class: 'ctext' }, [
          h('span', { class: 'k', text: 'Quán quân Chúa Nhật ' + N3.fmtShort(lastISO) }),
          h('b', { text: champ.name }),
          h('span', { class: 'v', text: pts(champ.weekly[lastISO].total) + ' điểm trong tuần' })
        ]),
        N3.mascot(champ.doi, 46, 'cm')
      ]));
    }

    var mine = N3.myTeam();
    if (mine && !model.teams[mine]) mine = null;
    p.appendChild(teamPicker(mine));
    if (mine) p.appendChild(myTeamSummary(mine));

    var prev = previousRanking();
    var max = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season.total; })) || 1;

    // Hạng 1: thẻ lớn — linh vật trong vòng nguyệt quế, vương miện, huy chương vàng
    var lead = model.teams[model.ranking[0]], ls = lead.season;
    p.appendChild(h('article', { class: 'hero2' + (lead.doi === mine ? ' mine' : ''), style: { '--team': lead.color } }, [
      h('div', { class: 'hero-art' }, [
        h('span', { class: 'rays', 'aria-hidden': 'true' }),
        N3.asset('laurel', 150, 'laurel'),
        N3.mascot(lead.doi, 92, 'hero-m'),
        N3.asset('crown', 50, 'crown'),
        h('span', { class: 'hero-medal' }, [N3.medal(1, 46)])
      ]),
      h('div', { class: 'hero-info' }, [
        h('div', { class: 'hname' }, [
          h('b', { text: lead.name }),
          lead.doi === mine ? h('span', { class: 'tag-mine', text: 'Đội của em' }) : null,
          moveTag(lead.doi, prev)
        ]),
        h('p', { class: 'hsub', text: lead.active.length + ' em, trung bình ' + pts(ls.avg) + ' điểm/tuần' }),
        h('p', { class: 'hscore' }, [h('b', { text: pts(ls.total) }), h('span', { text: 'điểm' })]),
        h('div', { class: 'xp' }, [h('i', { style: { width: '100%' } })]),
        h('div', { class: 'hchips' }, [
          critChip('cc', ls.cc), critChip('ht', ls.ht), critChip('kl', ls.kl)
        ]),
        streakTag(lead)
      ])
    ]));

    // Hạng 2 trở đi: một dòng gọn
    var list = h('div', { class: 'rows2' });
    model.ranking.slice(1).forEach(function (doi) {
      var t = model.teams[doi], se = t.season;
      list.appendChild(h('div', { class: 'row2' + (doi === mine ? ' mine' : ''), style: { '--team': t.color } }, [
        N3.medal(t.rank, 38),
        N3.mascot(doi, 44),
        h('div', { class: 'rinfo' }, [
          h('div', { class: 'rname' }, [
            h('b', { text: t.name }),
            doi === mine ? h('span', { class: 'tag-mine', text: 'Đội của em' }) : null,
            streakTag(t)
          ]),
          h('div', { class: 'xp' }, [h('i', { style: { width: Math.max(4, se.total / max * 100) + '%' } })])
        ]),
        h('div', { class: 'rscore' }, [h('b', { text: pts(se.total) }), moveTag(doi, prev)])
      ]));
    });
    p.appendChild(list);

    // Huy hiệu mùa giải: mỗi tiêu chí một huy hiệu, kèm linh vật đội đang giữ
    var awards = [['cc', 'badge-cc', 'Chuyên cần nhất'], ['ht', 'badge-ht', 'Học tập giỏi nhất'], ['kl', 'badge-kl', 'Kỷ luật tốt nhất']];
    var box = h('div', { class: 'awards2' });
    awards.forEach(function (a) {
      var winner = model.teams[N3.rankBy(model, a[0])[0]];
      if (!winner || winner.season[a[0]] === null) return;
      box.appendChild(h('div', { class: 'aw', style: { '--team': winner.color } }, [
        h('div', { class: 'aw-art' }, [N3.asset(a[1], 76), N3.mascot(winner.doi, 30, 'aw-m')]),
        h('b', { text: a[2] }),
        h('span', { text: winner.name + ', ' + fmt(winner.season[a[0]]) + '/10' })
      ]));
    });
    if (box.children.length) {
      p.appendChild(h('h2', { class: 'sec', text: 'Huy hiệu mùa giải' }));
      p.appendChild(box);
    }

    p.appendChild(h('h2', { class: 'sec', text: 'Điểm thi đua theo tuần' }));
    p.appendChild(weekTable(function (wk) { return wk.hasData ? pts(wk.total) : '–'; }, 'total'));

    celebrate(mine, prev, lastISO);
  }

  /** Chip điểm trung bình một tiêu chí, có biểu tượng */
  function critChip(key, val) {
    return h('span', { class: 'cchip', title: CRIT[key] + ', điểm trung bình thang 10' },
      [N3.asset('icon-' + key, 20), fmt(val)]);
  }

  /**
   * Pháo giấy khi đội của em đang dẫn đầu hoặc vừa lên hạng — mỗi tình huống chỉ
   * một lần trên mỗi máy, để không thành phiền.
   */
  function celebrate(mine, prev, lastISO) {
    if (!mine) return;
    var t = model.teams[mine];
    var up = prev && prev[mine] && prev[mine] > t.rank;
    if (!(t.rank === 1 || up)) return;
    var key = 'nghia3_phao_' + lastISO + '_' + mine + '_' + t.rank;
    try { if (localStorage.getItem(key)) return; localStorage.setItem(key, '1'); } catch (e) { return; }
    setTimeout(N3.confetti, 400);
  }

  /* ---------- Tab từng tiêu chí ---------- */
  function renderCriterion(key, cell) {
    var label = CRIT[key];
    var p = document.getElementById('panel-' + key); p.innerHTML = '';
    p.appendChild(h('div', { class: 'crit-head' }, [N3.asset('badge-' + key, 52), h('h2', { text: label })]));
    if (!model.dates.length) {
      p.appendChild(N3.stateView({ title: 'Chưa có dữ liệu ' + label.toLowerCase(), text: 'Số liệu sẽ hiện sau buổi sinh hoạt đầu tiên.' }));
      return;
    }
    var order = N3.rankBy(model, key);
    var tw = h('div', { class: 'table-wrap' });
    var tbl = h('table');
    tbl.appendChild(h('thead', null, [h('tr', null, [
      h('th', { text: 'Hạng' }), h('th', { text: 'Đội' }),
      h('th', { class: 'num', text: 'Điểm TB' }),
      key === 'cc' ? h('th', { class: 'num', text: 'Có mặt' }) : null
    ])]));
    var tb = h('tbody');
    order.forEach(function (doi, i) {
      var t = model.teams[doi], se = t.season;
      tb.appendChild(h('tr', { class: doi === N3.myTeam() ? 'mine' : '' }, [
        h('td', { text: String(i + 1) }),
        h('td', null, [h('span', { class: 'tcell' }, [N3.mascot(doi, 26), t.name])]),
        h('td', { class: 'num' + (i === 0 ? ' best' : ''), text: fmt(se[key]) }),
        key === 'cc' ? h('td', { class: 'num', text: se.recorded ? se.present + '/' + se.recorded : '–' }) : null
      ]));
    });
    tbl.appendChild(tb); tw.appendChild(tbl); p.appendChild(tw);

    p.appendChild(h('h2', { class: 'sec', text: label + ' theo tuần' }));
    p.appendChild(weekTable(cell, key));
  }

  /* ---------- Tab Bài học ---------- */
  function renderLessons() {
    var p = document.getElementById('panel-bai'); p.innerHTML = '';
    var list = (raw.lessons || []).filter(function (l) { return l.tenBai; })
                 .sort(function (a, b) { return a.ngay < b.ngay ? 1 : -1; });
    if (!list.length) {
      p.appendChild(N3.stateView({ img: 'empty-lesson', title: 'Chưa có bài học nào',
        text: 'Huynh Trưởng sẽ đăng bài sau mỗi buổi học để các em ôn lại trong tuần.' }));
      return;
    }
    list.forEach(function (l, i) {
      var body = h('div', { class: 'lesson-body' });
      if (l.loiChua) body.appendChild(h('blockquote', { class: 'loichua' }, [l.loiChua, l.trichDan ? h('cite', { text: l.trichDan }) : null]));
      if (l.yChinh && l.yChinh.length) {
        body.appendChild(h('h4', { text: 'Ý chính cần nhớ' }));
        var ul = h('ul', { class: 'ychinh' });
        l.yChinh.forEach(function (y) { ul.appendChild(h('li', { text: y })); });
        body.appendChild(ul);
      }
      if (l.cauHoi) body.appendChild(h('div', { class: 'suyniem' }, [h('b', { text: 'Suy niệm' }), l.cauHoi]));
      var det = h('details', { class: 'lesson' }, [
        h('summary', null, [h('span', { class: 'ngay', text: N3.fmtVN(l.ngay) }), h('span', { class: 'ten', text: l.tenBai })]),
        body
      ]);
      if (i === 0) det.open = true;
      p.appendChild(det);
    });
  }

  /** Bảng theo tuần: hàng = Chúa Nhật, cột = đội */
  function weekTable(cell, key) {
    var doiList = Object.keys(model.teams).map(Number).sort();
    var mineNow = N3.myTeam();
    var tw = h('div', { class: 'table-wrap' });
    var tbl = h('table', { class: 'wk' });
    tbl.appendChild(h('thead', null, [h('tr', null, [h('th', { text: 'CN' })].concat(doiList.map(function (d) {
      return h('th', { class: 'num' + (d === mineNow ? ' mine' : '') }, [h('span', { class: 'thcell', 'aria-label': model.teams[d].name }, [N3.mascot(d, 22), String(d)])]);
    })))]));
    var tb = h('tbody');
    model.dates.slice().reverse().forEach(function (iso) {
      var vals = doiList.map(function (d) { return model.teams[d].weekly[iso]; });
      var best = Math.max.apply(null, vals.map(function (w) { var v = w[key]; return v === null || v === undefined ? -1 : v; }));
      tb.appendChild(h('tr', null, [h('td', { text: N3.fmtShort(iso) })].concat(vals.map(function (w, i) {
        var v = w[key]; var isBest = v !== null && v !== undefined && v === best && best > 0;
        return h('td', { class: 'num' + (isBest ? ' best' : '') + (doiList[i] === mineNow ? ' mine' : ''), text: cell(w) });
      }))));
    });
    tbl.appendChild(tb); tw.appendChild(tbl);
    return tw;
  }

  N3.mountRoleMenu({ page: 'index', role: null, onReload: function () { load(); } });
  load();
  setInterval(load, 5 * 60 * 1000);   // tự làm mới khi chiếu lên màn hình
})();
</script>
</body>
</html>
