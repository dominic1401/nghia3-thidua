<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bảng thi đua Nghĩa 3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header class="mast">
    <div class="brand"><img class="logo" src="logo.png" alt="Huy hiệu lớp Nghĩa Sĩ 3" width="76" height="76"><div>
      <p class="org" id="org">Đoàn Thiếu Nhi Thánh Tâm – Giáo xứ Gia Định</p>
      <h1 id="title">Bảng thi đua lớp Nghĩa 3</h1>
      <p class="theme" id="theme">Môn đệ nhỏ loan Tin Mừng</p>
    </div></div>
  </header>

  <div id="status"></div>

  <div class="tabs" role="tablist" id="tabs">
    <button role="tab" aria-selected="true" data-tab="tong">🏆 Tổng hợp</button>
    <button role="tab" data-tab="cc">🔥 Chuyên cần</button>
    <button role="tab" data-tab="ht">📖 Học tập</button>
    <button role="tab" data-tab="kl">🛡️ Kỷ luật</button>
    <button role="tab" data-tab="bai">📖 Bài học</button>
  </div>

  <section class="panel" id="panel-tong"></section>
  <section class="panel" id="panel-cc" hidden></section>
  <section class="panel" id="panel-ht" hidden></section>
  <section class="panel" id="panel-kl" hidden></section>
  <section class="panel" id="panel-bai" hidden></section>

  <p class="note" id="rule" style="margin-top:28px"></p>
  <p class="updated" id="updated"></p>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
<script>
(function () {
  var h = N3.h, fmt = N3.fmt;
  var model = null, raw = null;

  /* Tabs */
  document.getElementById('tabs').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-tab]'); if (!b) return;
    document.querySelectorAll('#tabs button').forEach(function (x) { x.setAttribute('aria-selected', x === b); });
    document.querySelectorAll('.panel').forEach(function (p) { p.hidden = p.id !== 'panel-' + b.dataset.tab; });
    // công thức tính điểm không liên quan tới tab Bài học
    document.getElementById('rule').hidden = b.dataset.tab === 'bai';
  });

  function load() {
    document.getElementById('status').innerHTML = '<p class="note">Đang tải dữ liệu…</p>';
    N3.apiGet('data').then(function (res) {
      raw = res.data; model = N3.compute(raw);
      document.getElementById('status').innerHTML = '';
      render();
    }).catch(function (err) {
      document.getElementById('status').innerHTML =
        '<div class="error">Không tải được dữ liệu: ' + err.message +
        '. Kiểm tra URL Apps Script trong config.js hoặc <button class="btn ghost" onclick="N3.resetApi();location.reload()">nhập lại URL</button></div>';
    });
  }

  function render() {
    var s = raw.settings;
    document.getElementById('org').textContent = s.xuDoan || '';
    document.getElementById('title').textContent = 'Bảng thi đua lớp ' + (s.lop || 'Nghĩa 3') + ' · ' + (s.namHoc || '');
    document.getElementById('theme').textContent = s.chuDe || '';
    document.getElementById('rule').textContent =
      'Điểm tuần = ' + s.weights.cc + '% chuyên cần + ' + s.weights.ht + '% học tập + ' + s.weights.kl +
      '% kỷ luật (mỗi tiêu chí thang 10). Chuyên cần tính tự động từ điểm danh của Đội trưởng; xếp hạng theo tổng điểm lũy kế cả năm.';
    document.getElementById('updated').textContent = 'Cập nhật ' + new Date(raw.generatedAt).toLocaleString('vi-VN');

    renderTong();
    renderCriterion('cc', 'Chuyên cần', function (wk) { return wk.recorded ? fmt(wk.cc) + ' (' + wk.present + '/' + wk.recorded + ')' : '–'; });
    renderCriterion('ht', 'Học tập', function (wk) { return fmt(wk.ht); });
    renderCriterion('kl', 'Kỷ luật', function (wk) { return fmt(wk.kl); });
    renderLessons();
  }

  /** Xếp hạng lũy kế tính đến trước tuần mới nhất, để biết đội lên/xuống mấy bậc */
  function previousRanking() {
    if (model.dates.length < 2) return null;
    var upto = model.dates.slice(0, -1);
    var totals = Object.keys(model.teams).map(Number).map(function (doi) {
      var t = model.teams[doi], sum = 0;
      upto.forEach(function (iso) { if (t.weekly[iso] && t.weekly[iso].hasData) sum += t.weekly[iso].total; });
      return { doi: doi, sum: sum };
    });
    totals.sort(function (a, b) { return (b.sum - a.sum) || (a.doi - b.doi); });
    var map = {};
    totals.forEach(function (x, i) { map[x.doi] = i + 1; });
    return map;
  }

  /** Số Chúa Nhật liên tiếp gần nhất đội đi đủ (chuyên cần 10) */
  function streak(t) {
    var n = 0;
    for (var i = model.dates.length - 1; i >= 0; i--) {
      var wk = t.weekly[model.dates[i]];
      if (wk && wk.recorded && wk.cc === 10) n++; else break;
    }
    return n;
  }

  /** Hàng nút chọn đội. Chạm lại đúng đội đang chọn để bỏ chọn. */
  function teamPicker(mine) {
    var wrap = h('div', { class: 'picker', role: 'group', 'aria-label': 'Chọn đội của em' }, [
      h('span', { class: 'lab', text: 'Đội của em' })
    ]);
    Object.keys(model.teams).map(Number).sort().forEach(function (d) {
      var t = model.teams[d];
      wrap.appendChild(h('button', {
        type: 'button', class: 'pick' + (d === mine ? ' on' : ''), style: { '--team': t.color },
        'aria-pressed': d === mine ? 'true' : 'false', text: String(d),
        'aria-label': t.name,
        onclick: function () { N3.setMyTeam(d === mine ? null : d); render(); }
      }));
    });
    return wrap;
  }

  /** Một câu trả lời thẳng: đội em hạng mấy, cách đội đứng trên bao nhiêu */
  function myTeamSummary(doi) {
    var t = model.teams[doi], rank = t.rank;
    var msg;
    if (rank === 1) {
      var second = model.teams[model.ranking[1]];
      var lead = second ? t.season.total - second.season.total : 0;
      msg = [h('b', { text: t.name + ' đang dẫn đầu' }),
             second ? ' — hơn ' + second.name + ' ' + fmt(lead, 1) + ' điểm. Giữ vững nhé!' : '.'];
    } else {
      var above = model.teams[model.ranking[rank - 2]];
      var gap = above.season.total - t.season.total;
      msg = [h('b', { text: t.name + ' đang hạng ' + rank }),
             ' — cách ' + above.name + ' ' + fmt(gap, 1) + ' điểm.'];
      var hint = weakest(t);
      if (hint) msg.push(' Nâng ' + hint + ' là cách nhanh nhất để vượt lên.');
    }
    return h('div', { class: 'mysum', style: { '--team': t.color } }, msg);
  }

  /** Tiêu chí đội đang yếu nhất so với đội dẫn đầu tiêu chí đó, có tính trọng số */
  function weakest(t) {
    var w = model.weights, keys = [['cc', 'chuyên cần'], ['ht', 'học tập'], ['kl', 'kỷ luật']];
    var best = null, bestGain = 0;
    keys.forEach(function (k) {
      var top = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season[k[0]] || 0; }));
      var gain = (top - (t.season[k[0]] || 0)) * w[k[0]];
      if (gain > bestGain) { bestGain = gain; best = k[1]; }
    });
    return best;
  }

  function renderTong() {
    var p = document.getElementById('panel-tong'); p.innerHTML = '';
    if (!model.dates.length) {
      p.appendChild(h('div', { class: 'empty', text: 'Chưa có tuần nào được điểm danh hay chấm điểm. Bảng xếp hạng sẽ xuất hiện sau Chúa Nhật đầu tiên.' }));
      return;
    }

    // Quán quân tuần gần nhất
    var lastISO = model.dates[model.dates.length - 1];
    var weekOrder = model.ranking.slice().sort(function (a, b) {
      return (model.teams[b].weekly[lastISO].total - model.teams[a].weekly[lastISO].total) || (a - b);
    });
    var champ = model.teams[weekOrder[0]];
    if (champ.weekly[lastISO].hasData) {
      p.appendChild(h('div', { class: 'champ' }, [
        h('div', { class: 'big', text: '🏆' }),
        h('div', null, [
          h('span', { text: 'Quán quân Chúa Nhật ' + N3.fmtVN(lastISO) }),
          champ.name + ' · ' + fmt(champ.weekly[lastISO].total, 2) + ' điểm'
        ])
      ]));
    }

    // ---- Đội của em: chọn một lần, trang ghi nhớ ----
    var mine = N3.myTeam();
    if (mine && !model.teams[mine]) mine = null;
    p.appendChild(teamPicker(mine));
    if (mine) p.appendChild(myTeamSummary(mine));

    // ---- Bảng xếp hạng: hạng 1 là thẻ lớn, hạng 2–4 gọn bên dưới ----
    // (Trước đây có thêm bục vinh danh riêng, khiến top 3 hiện hai lần.)
    var prev = previousRanking();
    var max = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season.total; })) || 1;
    var medals = { 1: '🥇', 2: '🥈', 3: '🥉' };
    var bestCC = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season.cc || 0; }));
    var bestHT = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season.ht || 0; }));
    var bestKL = Math.max.apply(null, model.ranking.map(function (d) { return model.teams[d].season.kl || 0; }));

    var lb = h('div', { class: 'lb' });
    model.ranking.forEach(function (doi) {
      var t = model.teams[doi], se = t.season;
      var move = null;
      if (prev && prev[doi]) {
        var d = prev[doi] - t.rank;
        // Chỉ hiện khi thật sự lên/xuống hạng; giữ hạng thì không cần ký hiệu
        if (d !== 0) {
          move = h('span', { class: 'move ' + (d > 0 ? 'up' : 'down'),
            'aria-label': d > 0 ? 'Lên ' + d + ' hạng so với tuần trước' : 'Xuống ' + (-d) + ' hạng so với tuần trước',
            text: d > 0 ? '▲ ' + d : '▼ ' + (-d) });
        }
      }
      var chips = h('div', { class: 'chips' }, [
        h('span', { class: 'chip' + (se.cc === bestCC && bestCC > 0 ? ' win' : ''), text: '🔥 ' + fmt(se.cc) }),
        h('span', { class: 'chip' + (se.ht === bestHT && bestHT > 0 ? ' win' : ''), text: '📖 ' + fmt(se.ht) }),
        h('span', { class: 'chip' + (se.kl === bestKL && bestKL > 0 ? ' win' : ''), text: '🛡️ ' + fmt(se.kl) })
      ]);
      var st = streak(t);
      if (st >= 2) chips.appendChild(h('span', { class: 'chip win', text: '⚡ ' + st + ' tuần đi đủ' }));

      var hero = t.rank === 1;
      var cls = 'lb-row' + (hero ? ' hero' : '') + (doi === mine ? ' mine' : '');
      lb.appendChild(h('div', { class: cls, style: { '--team': t.color }, 'data-doi': doi }, [
        hero ? h('div', { class: 'crown', text: '👑', 'aria-hidden': 'true' }) : null,
        h('div', { class: 'medal' + (medals[t.rank] ? '' : ' plain'), text: medals[t.rank] || String(t.rank),
                   'aria-label': 'Hạng ' + t.rank }),
        h('div', { class: 'body' }, [
          h('div', { class: 'head' }, [
            h('b', { text: t.name }),
            doi === mine ? h('span', { class: 'tag-mine', text: 'Đội của em' }) : null,
            h('span', { class: 'chip', text: t.active.length + ' em' }),
            move
          ]),
          h('div', { class: 'xp' }, [h('i', { style: { width: (se.total / max * 100) + '%' } })]),
          chips
        ]),
        h('div', { class: 'pts', text: fmt(se.total, 1) }, [h('small', { text: 'TB ' + fmt(se.avg, 1) + '/tuần' })])
      ]));
    });
    p.appendChild(lb);
    p.appendChild(h('p', { class: 'legend', text: '🔥 Chuyên cần · 📖 Học tập · 🛡️ Kỷ luật — điểm trung bình mỗi tuần, thang 10. Ô vàng là đội dẫn đầu tiêu chí đó.' }));

    // Huy hiệu theo tiêu chí
    var awards = [
      { ico: '🔥', title: 'Chuyên cần nhất', key: 'cc' },
      { ico: '📖', title: 'Học tập giỏi nhất', key: 'ht' },
      { ico: '🛡️', title: 'Kỷ luật tốt nhất', key: 'kl' }
    ];
    var box = h('div', { class: 'awards' });
    awards.forEach(function (a) {
      var winner = N3.rankBy(model, a.key)[0];
      var t = model.teams[winner];
      if (!t || t.season[a.key] === null) return;
      box.appendChild(h('div', { class: 'award' }, [
        h('div', { class: 'ico', text: a.ico }),
        h('div', null, [h('b', { text: t.name }), h('span', { text: a.title + ' · ' + fmt(t.season[a.key]) + '/10' })])
      ]));
    });
    if (box.children.length) {
      p.appendChild(h('h2', { class: 'sec' }, ['🎖️ Huy hiệu mùa giải']));
      p.appendChild(box);
    }

    p.appendChild(h('h2', { class: 'sec' }, ['📅 Điểm tổng theo tuần']));
    p.appendChild(weekTable(function (wk) { return wk.hasData ? fmt(wk.total, 2) : '–'; }, 'total'));
  }


  /** Sổ tay bài học để các em ôn lại trong tuần */
  function renderLessons() {
    var p = document.getElementById('panel-bai'); p.innerHTML = '';
    var list = (raw.lessons || []).filter(function (l) { return l.tenBai; })
                 .sort(function (a, b) { return a.ngay < b.ngay ? 1 : -1; });
    if (!list.length) {
      p.appendChild(h('div', { class: 'empty', text: 'Chưa có bài học nào được đăng. Huynh Trưởng sẽ soạn sau mỗi buổi học.' }));
      return;
    }
    list.forEach(function (l, i) {
      var body = h('div', { class: 'lesson-body' });
      if (l.loiChua) {
        body.appendChild(h('blockquote', { class: 'loichua' }, [
          l.loiChua,
          l.trichDan ? h('cite', { text: l.trichDan }) : null
        ]));
      }
      if (l.yChinh && l.yChinh.length) {
        body.appendChild(h('h4', { text: 'Ý chính cần nhớ' }));
        var ul = h('ul', { class: 'ychinh' });
        l.yChinh.forEach(function (y) { ul.appendChild(h('li', { text: y })); });
        body.appendChild(ul);
      }
      if (l.cauHoi) {
        body.appendChild(h('div', { class: 'suyniem' }, [
          h('b', { text: 'Suy niệm  ' }), l.cauHoi
        ]));
      }
      var det = h('details', { class: 'lesson' }, [
        h('summary', null, [
          h('span', { class: 'ngay', text: N3.fmtVN(l.ngay) }),
          h('span', { class: 'ten', text: l.tenBai })
        ]),
        body
      ]);
      if (i === 0) det.open = true;   // bài mới nhất mở sẵn
      p.appendChild(det);
    });
  }

  function renderCriterion(key, label, cell) {
    var p = document.getElementById('panel-' + key); p.innerHTML = '';
    if (!model.dates.length) { p.appendChild(h('div', { class: 'empty', text: 'Chưa có dữ liệu ' + label.toLowerCase() + '.' })); return; }
    var order = N3.rankBy(model, key);
    var tw = h('div', { class: 'table-wrap' });
    var tbl = h('table');
    tbl.appendChild(h('thead', null, [h('tr', null, [
      h('th', { text: 'Hạng' }), h('th', { text: 'Đội' }),
      h('th', { class: 'num', text: 'Điểm TB' }),
      h('th', { class: 'num', text: 'Tổng ' + label.toLowerCase() }),
      key === 'cc' ? h('th', { class: 'num', text: 'Có mặt / điểm danh' }) : null,
      h('th', { class: 'num', text: 'Số tuần' })
    ])]));
    var tb = h('tbody');
    order.forEach(function (doi, i) {
      var t = model.teams[doi], se = t.season;
      tb.appendChild(h('tr', { class: doi === N3.myTeam() ? 'mine' : '' }, [
        h('td', { text: String(i + 1) }),
        h('td', null, [h('span', { class: 'team-dot', style: { '--team': t.color } }), t.name]),
        h('td', { class: 'num' + (i === 0 ? ' best' : ''), text: fmt(se[key]) }),
        h('td', { class: 'num', text: fmt(se[key + 'Sum']) }),
        key === 'cc' ? h('td', { class: 'num', text: se.recorded ? se.present + ' / ' + se.recorded + ' (' + se.rate + '%)' : '–' }) : null,
        h('td', { class: 'num', text: String(se[key + 'Weeks'] !== undefined ? se[key + 'Weeks'] : se.weeks) })
      ]));
    });
    tbl.appendChild(tb); tw.appendChild(tbl); p.appendChild(tw);

    p.appendChild(h('h2', { class: 'sec', text: '📅 ' + label + ' theo tuần' }));
    p.appendChild(weekTable(cell, key));
  }

  /** Bảng: hàng = tuần, cột = đội */
  function weekTable(cell, key) {
    var doiList = Object.keys(model.teams).map(Number).sort();
    var tw = h('div', { class: 'table-wrap' });
    var tbl = h('table');
    tbl.appendChild(h('thead', null, [h('tr', null, [h('th', { text: 'Chúa Nhật' })].concat(doiList.map(function (d) {
      return h('th', { class: 'num' + (d === N3.myTeam() ? ' mine' : '') }, [h('span', { class: 'team-dot', style: { '--team': model.teams[d].color } }), model.teams[d].name]);
    })))]));
    var tb = h('tbody');
    model.dates.slice().reverse().forEach(function (iso) {
      var vals = doiList.map(function (d) { return model.teams[d].weekly[iso]; });
      var best = Math.max.apply(null, vals.map(function (w) { var v = w[key]; return v === null || v === undefined ? -1 : v; }));
      var mineNow = N3.myTeam();
      tb.appendChild(h('tr', null, [h('td', { text: N3.fmtVN(iso) })].concat(vals.map(function (w, i) {
        var v = w[key]; var isBest = v !== null && v !== undefined && v === best && best > 0;
        return h('td', { class: 'num' + (isBest ? ' best' : '') + (doiList[i] === mineNow ? ' mine' : ''), text: cell(w) });
      }))));
    });
    tbl.appendChild(tb); tw.appendChild(tbl);
    return tw;
  }

  N3.enhanceTabs(document.getElementById('tabs'));
  N3.mountRoleMenu({ page: 'index', role: null, onReload: function () { load(); } });

  load();
  setInterval(load, 5 * 60 * 1000); // tự làm mới mỗi 5 phút khi chiếu lên màn hình
})();
</script>
</body>
</html>
